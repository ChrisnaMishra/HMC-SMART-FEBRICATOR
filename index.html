<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hulas Smart Fabricator</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#D42F2F">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--red:#D42F2F;--navy:#12203D;--navy2:#233868;--nt:#12203D;--bg:#F4F5F7;--white:#fff;--card:#fff;--st:#EDEFF1;--ink:#1D2230;--muted:#6B7280;--line:#E4E6EA;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161A;--white:#1E2027;--card:#262933;--st:#2C303B;--ink:#EDEEF0;--muted:#9BA0AA;--line:#3A3F4B;--nt:#C9D3F0}}
:root[data-theme="dark"]{--bg:#15161A;--white:#1E2027;--card:#262933;--st:#2C303B;--ink:#EDEEF0;--muted:#9BA0AA;--line:#3A3F4B;--nt:#C9D3F0}
*{box-sizing:border-box}html{width:100%;min-width:0;scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body{margin:0;width:100%;min-width:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
.phone{width:100%;max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--white);overflow-x:hidden}
h1,h2,h3,h4{margin:0}button{font:inherit;cursor:pointer;border:none;max-width:100%}
.screen{display:none;width:100%;min-height:100vh;min-height:100dvh;flex-direction:column;overflow-x:hidden}.screen.active{display:flex}
.cta{background:var(--red);color:#fff;font-weight:600;font-size:15px;padding:15px 0;width:100%;border-radius:14px}
.cta.outline{background:none;border:1.5px solid rgba(255,255,255,.5)}.cta.ghost{background:var(--card);color:var(--nt);border:1.5px solid var(--line)}.cta.navy{background:var(--navy)}
#splash{background:linear-gradient(160deg,#12203D,#1B2C52 55%,#0d1730);color:#fff;align-items:center;justify-content:center;text-align:center;padding:40px 28px}
.badge{background:#fff;border-radius:20px;padding:18px 26px;margin-bottom:22px}.badge b{display:block;font-size:34px;font-weight:800;color:var(--red)}.badge span{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:2px}
#welcome{height:100svh;min-height:0;max-height:100svh;overflow:hidden;padding:18px 20px 14px;justify-content:space-between}\n#welcome .stack{position:absolute;left:20px;right:20px;bottom:10px;margin:0;gap:7px}
.val{background:var(--st);border-radius:16px;padding:13px 15px;margin-bottom:9px}.val h3{font-size:14px;line-height:1.2}.val p{margin:3px 0 0;font-size:12px;line-height:1.25;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}.stack .cta{padding:13px 0;border-radius:12px}
.form{padding:18px 24px 24px;overflow-y:auto;overflow-x:hidden;justify-content:flex-start}.form .back{width:34px;height:34px;border-radius:10px;background:var(--st);display:flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer;flex:0 0 auto}.form h2{font-size:21px;line-height:1.2}.form p{margin-top:6px;margin-bottom:10px}
.form h2{font-size:23px}.form p{color:var(--muted);font-size:13.5px}\n#login{height:100svh;min-height:0;max-height:100svh;overflow:hidden!important;padding:14px 22px 12px;justify-content:center!important}\n#login .back{width:30px;height:30px;margin-bottom:7px}\n#login h2{font-size:21px}\n#login p{margin:4px 0 7px;font-size:12px;line-height:1.25}\n#login label{margin:8px 0 4px;font-size:11px}\n#login input{padding:10px 12px;font-size:13.5px}\n#login .rem{margin:8px 0;font-size:11.5px}\n#login .cta{padding:11px 0;border-radius:11px}\n#login .err{margin-top:7px;padding:8px 10px;font-size:12px}\n#login p[style*="text-align:center"]{margin-top:7px!important;margin-bottom:0}\n@media(max-height:700px){#login{padding-top:8px;padding-bottom:8px}#login .back{margin-bottom:4px}#login p{margin:2px 0 5px}#login label{margin:6px 0 3px}#login .rem{margin:6px 0}#login .cta{padding:10px 0}#login p[style*="text-align:center"]{margin-top:5px!important}}
label,.fl{font-size:12px;font-weight:600;display:block;margin:14px 0 6px;color:var(--muted)}
input,select{width:100%;max-width:100%;min-width:0;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--st);font:inherit;font-size:14.5px;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--red)}
.sec{font-size:11px;letter-spacing:1.5px;color:var(--red);font-weight:700;margin:20px 0 0}
.row2{display:flex;gap:10px;min-width:0}.row2>div{flex:1;min-width:0}
.err{background:#FDECEC;border:1px solid #F5C2C2;color:#A81F1F;border-radius:12px;padding:11px 14px;margin-top:12px;font-size:13px;font-weight:600;display:none}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:13px;color:var(--muted)}.rem input{width:auto}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 20px 44px}
.hero b{background:#fff;color:var(--red);font-weight:800;padding:5px 11px;border-radius:8px}
.band{background:var(--red);margin-top:16px;border-radius:14px;padding:12px 16px;font-size:12.5px;font-weight:700}
.greet{background:var(--card);border-radius:16px;padding:16px 18px;margin:-24px 18px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 24px rgba(20,30,60,.12);position:relative}
.greet .n{color:var(--red);font-weight:800;font-size:19px;text-align:right}.greet small{display:block;color:var(--muted);font-size:10.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px}
.tile{background:var(--card);border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(20,30,60,.08);cursor:pointer}.tile.wide{grid-column:1/3;background:var(--red);color:#fff}
.tile h4{font-size:14px}.tile p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}.tile.wide p{color:#FFE1E1}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 18px}
.shape{background-size:cover;background-position:center;aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#C7CBD1,#EDEFF1);color:var(--navy);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:700;cursor:pointer}
.next{margin:0 18px 18px;background:#FDECEC;color:#1D2230;border-radius:14px;padding:14px 16px;font-size:12.5px;cursor:pointer}
.bar{height:7px;background:#F5D0D0;border-radius:5px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.nav{position:sticky;bottom:0;width:100%;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px));margin-top:auto;z-index:20}
.nav button{background:none;color:var(--muted);font-size:11px}.nav .on{color:var(--red);font-weight:700}
.head{padding:20px 20px 14px;background:var(--white);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-top:12px;background:var(--st);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px 0;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);background:none}.tabs .on{background:var(--card);color:var(--red)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:14px 18px;box-shadow:0 4px 14px rgba(20,30,60,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:40px;height:40px;border-radius:10px;background:var(--st);font-size:18px;font-weight:700;color:var(--nt)}.qty div{flex:1;text-align:center;font-size:18px;font-weight:700}
.res{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:16px;padding:18px;margin:16px 18px;color:#fff}
.res div{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:#DCE2F0}.res .t{border-top:1px solid rgba(255,255,255,.2);margin-top:6px;padding-top:12px;font-size:16px;font-weight:700;color:#fff}.res .p{color:#FFD27A;font-weight:700}
.warn{background:#FFF3E0;color:#8A5A00;border-radius:12px;padding:12px 14px;margin:14px 18px;font-size:12.5px}
.btns{display:flex;gap:10px;padding:0 18px 18px;min-width:0}.btns .cta{padding:14px 0;font-size:13.5px;border-radius:12px;min-width:0}
.cut{display:flex;gap:8px;margin-bottom:8px}.cut button{width:38px;border-radius:9px;background:#FDECEC;color:var(--red);font-weight:700}
.pat{background:var(--st);border-radius:12px;padding:12px;margin-bottom:8px;font-size:12.5px;font-weight:700}.pat span{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:4px 9px;border-radius:8px;margin:6px 6px 0 0}.pat span.w{background:none;color:var(--muted);border:1px dashed var(--muted)}
.ol{background:var(--card);border-radius:12px;padding:12px 14px;margin:0 18px 10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 10px rgba(20,30,60,.06);min-width:0}.ol>div:first-child{min-width:0;overflow-wrap:anywhere}
.ol small{display:block;color:var(--muted);font-size:11px}.ol .rm{color:var(--red);font-size:11px;font-weight:700;cursor:pointer;text-align:right}
.tot div{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;color:var(--muted)}.tot .g{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:16px;font-weight:700;color:var(--ink)}
.tot input{width:80px;padding:7px 10px}
.pts{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:20px;text-align:center}.pts b{display:block;font-size:34px;font-weight:800;color:#FFD27A}.pts small{font-size:12px;letter-spacing:1px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px}.rc{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(20,30,60,.08)}
.rc .im{aspect-ratio:1;background:var(--st);display:flex;align-items:center;justify-content:center;font-size:38px}.rc .im img{display:block;width:100%;height:100%;object-fit:cover}
.rc div.b{padding:10px}.rc h4{font-size:12.5px}.rc .pp{font-size:11.5px;color:var(--red);font-weight:700;margin:4px 0 6px}
.rb{width:100%;padding:8px 0;border-radius:9px;font-size:11.5px;font-weight:700;background:var(--red);color:#fff}.rb.lk{background:var(--st);color:var(--muted)}
.empty{text-align:center;padding:50px 30px;color:var(--muted);font-size:13.5px}

.home-wrap{padding-bottom:0}
.home-header{height:66px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff}

<script>
const $=id=>document.getElementById(id);
/* ===== OFFICIAL HULAS WEIGHT CHART (kg per 6m pipe) — single source ===== */
const W={round:{'1/2"':{light:2.070,heavy:2.520},'3/4" (0.60mm)':{thin:1.600},'3/4"':{light:3.228,heavy:4.070},'1"':{light:4.160,heavy:5.100},'1.5"':{light:6.520,heavy:7.780},'2"':{light:8.480,heavy:10.690}},
square:{'20x20':{light:4.160,heavy:5.100},'25x25':{light:5.280,heavy:6.610},'40x40':{light:8.480,heavy:10.690},'50x50':{light:11.150,heavy:12.800}},
rectangle:{'20x40':{light:6.520,heavy:7.780},'25x50':{light:8.480,heavy:10.690}}};
const CL={light:'Light',heavy:'Heavy',thin:'0.60 mm'},cap=s=>s[0].toUpperCase()+s.slice(1);
const R={'202':290,'304':475,sq:30,q34:10,vat:13,len:6};
const rateFor=s=>R[s.grade]+(s.shape!=='round'?R.sq:0)+(s.size.startsWith('3/4"')?R.q34:0);
const money=n=>'Rs. '+Math.round(n).toLocaleString('en-IN'),kg=n=>n.toLocaleString('en-IN',{maximumFractionDigits:3})+' kg',fp=n=>n.toLocaleString('en-IN',{maximumFractionDigits:1});
const vatOf=b=>b*R.vat/100;
function line(s,qty){const w=W[s.shape][s.size][s.cls]*qty;return{spec:`${s.grade} ${s.shape} ${s.size} (${CL[s.cls]})`,qty,weight:w,amount:w*rateFor(s),key:[s.grade,s.shape,s.size,s.cls].join('|')}}
/* ===== picker: Grade / Shape / Size / Class — chips re-render so the highlight always follows the choice ===== */
function Picker(id,s,o={}){const el=$(id),grade=o.grade!==false;
 const chips=(k,list,cur,lab)=>`<div class="chips">${list.map(v=>`<span class="chip ${v===cur?'on':''}" data-k="${k}" data-v="${v}">${lab?lab(v):v}</span>`).join('')}</div>`;
 const draw=()=>{const sizes=Object.keys(W[s.shape]);if(!sizes.includes(s.size))s.size=sizes[0];const cls=Object.keys(W[s.shape][s.size]);if(!cls.includes(s.cls))s.cls=cls[0];
  el.innerHTML=(grade?'<div class="fl">GRADE</div>'+chips('grade',['202','304'],s.grade):'')+'<div class="fl">SHAPE</div>'+chips('shape',['round','square','rectangle'],s.shape,cap)+
  '<div class="fl">SIZE</div><select>'+sizes.map((z,i)=>`<option value="${i}" ${z===s.size?'selected':''}>${z.replace(/"/g,'&quot;')}</option>`).join('')+'</select><div class="fl">CLASS</div>'+chips('cls',cls,s.cls,v=>CL[v]);};
 el.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;s[c.dataset.k]=c.dataset.v;draw();o.cb&&o.cb()};
 el.onchange=e=>{if(e.target.tagName==='SELECT'){s.size=Object.keys(W[s.shape])[e.target.value];draw();o.cb&&o.cb()}};draw();}
/* ===== accounts (this device only) ===== */
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let ACC=ld('hmc_accounts',{}),ME=null,POINTS=0,ORDER=[],CD=3;const WA='9779845656595';
function hash(t){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
async function pwHash(salt,pw){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return hash(salt+pw)+hash(pw+salt)}}
const cm=v=>(v||'').replace(/[\s-]/g,'').replace(/^\+?977(?=\d{10}$)/,''),err=(id,m)=>{const e=$(id);e.textContent=m;e.style.display=m?'block':'none'};
async function doRegister(){const g=i=>$(i).value.trim(),m=cm($('r-mob').value),p=$('r-pw').value;

const cu={grade:'304',shape:'round',size:'1"',cls:'light'};let cunit='ft',crows=[{len:3,qty:12},{len:2.5,qty:8}],clast=null;const FT=3.28084;
function cutUnitDraw(){$('cut-unit').innerHTML=['ft','m'].map(u=>`<span class="chip ${u===cunit?'on':''}" data-u="${u}">${u==='ft'?'Feet':'Metre'}</span>`).join('')}
$('cut-unit').onclick=e=>{const u=e.target.dataset.u;if(!u||u===cunit)return;const f=u==='m'?1/FT:FT;crows.forEach(r=>{if(r.len)r.len=+(r.len*f).toFixed(3)});cunit=u;cutUnitDraw();cutRows()};
function cutRows(){$('cut-rows').innerHTML=crows.map((r,i)=>`<div class="cut"><input type="number" step="any" value="${r.len}" placeholder="Length (${cunit})" onchange="crows[${i}].len=+this.value||0"><input type="number" value="${r.qty}" placeholder="Pieces" style="max-width:90px" onchange="crows[${i}].qty=parseInt(this.value)||0"><button onclick="crows.splice(${i},1);cutRows()">×</button></div>`).join('')}
function cutAdd(){crows.push({len:'',qty:1});cutRows()}
function runCut(){const toM=v=>cunit==='ft'?v/FT:v,disp=m=>(cunit==='ft'?m*FT:m).toFixed(2)+' '+cunit;let p=[];crows.forEach(r=>{if(r.len>0&&r.qty>0)for(let i=0;i<r.qty;i++)p.push(toM(r.len))});
 const bad=m=>{clast=null;$('cut-warn').innerHTML=`<div class="warn">${m}</div>`;$('cut-pat').style.display=$('cut-res').style.display='none'};
 if(!p.length)return bad('Add at least one valid cut length and quantity.');if(p.some(x=>x>R.len+1e-9))return bad('A cut length is longer than the 6m standard pipe.');$('cut-warn').innerHTML='';
 p.sort((a,b)=>b-a);const bins=[];p.forEach(x=>{const b=bins.find(b=>b.rem>=x-1e-9);if(b){b.cuts.push(x);b.rem-=x}else bins.push({cuts:[x],rem:R.len-x})});
 const tot=p.reduce((a,b)=>a+b,0),proc=bins.length*R.len,l=line(cu,bins.length),v=vatOf(l.amount);clast=l;
 $('cut-pat').style.display='block';$('cut-pat').innerHTML='<div class="fl">CUTTING PATTERN</div>'+bins.map((b,i)=>`<div class="pat">Pipe #${i+1} — ${(R.len-b.rem).toFixed(2)}m used, ${b.rem.toFixed(2)}m off-cut<br>${b.cuts.map(c=>`<span>${disp(c)}</span>`).join('')}${b.rem>.01?`<span class="w">waste ${disp(b.rem)}</span>`:''}</div>`).join('');
 $('cut-res').style.display='block';$('cut-res').innerHTML=`<div><span>6m pipes required</span><span>${bins.length}</span></div><div><span>Total cut length</span><span>${disp(tot)}</span></div><div><span>Off-cut / waste</span><span>${disp(proc-tot)}</span></div><div><span>Total weight</span><span>${kg(l.weight)}</span></div><div><span>Basic amount</span><span>${money(l.amount)}</span></div><div><span>VAT (${R.vat}%)</span><span>${money(v)}</span></div><div class="t"><span>Total</span><span>${money(l.amount+v)}</span></div><div><span>Points earned</span><span class="p">${l.weight.toFixed(3)} pts</span></div>`}

function renderRewards(){$('w-pts').textContent=fp(POINTS);$('w-grid').innerHTML=RW.map(([n,p,e],i)=>{const lk=POINTS<p;return`<div class="rc"><div class="im">${IMG[n]?`<img src="${IMG[n]}">`:e}</div><div class="b"><h4>${n}</h4><div class="pp">${p.toLocaleString('en-IN')} pts</div><button class="rb ${lk?'lk':''}" onclick="${lk?"openTools('calc')":`redeem(${i})`}">${lk?'Earn '+Math.ceil(p-POINTS).toLocaleString('en-IN')+' more ›':'REDEEM'}</button></div></div>`}).join('')}
function redeem(i){const[n,p]=RW[i];if(POINTS<p||!confirm(`Redeem ${n} for ${p.toLocaleString('en-IN')} points?`))return;
 if(!window.open(`https://wa.me/${WA}?text=${encodeURIComponent(`*HULAS REWARD REDEMPTION*\n\nFabricator: ${ME.name}\nMobile: ${ME.mobile}\nReward: ${n} (${p} pts)`)}`,'_blank'))return alert('Please allow pop-ups, then try again.');
 addPts(-p);renderAll()}
function renderHome(){if(!ME)return;$('h-greet').textContent='Namaste, '+ME.name+'!';$('h-id').textContent='Mobile: '+ME.mobile;$('h-pts').textContent=fp(POINTS);
 const nx=RW.find(r=>r[1]>POINTS)||RW[RW.length-1];$('n-name').textContent=nx[0];$('n-pts').textContent=nx[1].toLocaleString('en-IN')+' pts';$('n-bar').style.width=Math.min(100,POINTS/nx[1]*100)+'%';
 $('n-sub').textContent=POINTS>=nx[1]?'All rewards unlocked!':Math.ceil(nx[1]-POINTS).toLocaleString('en-IN')+' more points to unlock — 1 kg = 1 point.'}
function renderAll(){renderHome();renderRewards();renderOrder();if(ME){$('p-pts').textContent=fp(POINTS);$('p-name').textContent=ME.name;$('p-mob').textContent=ME.mobile;$('p-firm').textContent=ME.firm||'-'}}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=$('install-btn');if(b)b.style.display='block'});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=$('install-btn');if(b)b.style.display='none'});
async function installApp(){
  if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;const b=$('install-btn');if(b)b.style.display='none';return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios)return alert('To install Hulas Smart Fabricator on iPhone: tap Share in Safari, then choose Add to Home Screen.');
  alert('If your browser does not show the install prompt, open this link in Chrome and use the browser menu → Install app / Add to Home screen.');
}
/* ===== init: nobody is ever logged in on load — mobile + password are required every time ===== */
Picker('pk-calc',cs,{cb:runCalc});Picker('pk-rail',est.rail,{grade:false,cb:estStale});Picker('pk-post',est.post,{grade:false,cb:estStale});Picker('pk-cut',cu,{cb:()=>{clast=null}});
estGrade();cutUnitDraw();cutRows();runCalc();switchTool('calc');
{const m=ld('hmc_mobile','');if(m){$('l-mob').value=m;$('l-rem').checked=true}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
